<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Dashboard - SkillSwap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">Skill<span>Swap</span></div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="explore.html">Explore Skills</a>
            <a href="find-partners.html">Find Partners</a>
            <a href="about.html">About</a>
        </div>

        <div class="nav-buttons">
            <a href="dashboard.html" class="login-btn">Dashboard</a>
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="join-btn">Join Now</a>
        </div>
    </nav>
</header>

<section class="partners-section" style="min-height:600px;">

    <p class="small-title">✦ PROGRESS</p>
    <h1>My Progress Dashboard</h1>

    <div class="partner-grid" style="justify-content:center; margin-top:40px;">

        <div class="partner-card" style="max-width:400px;">

            <div class="partner-avatar">📈</div>

            <h3>Python Learning</h3>

            <p class="partner-role">Progress: 60%</p>

            <p>Lessons Completed: 3 / 5</p>

            <p>Learning Time: 4 Hours</p>

            <button class="join-btn"
                onclick="alert('🎉 Progress updated successfully!')">
                Update Progress
            </button>

        </div>

    </div>

</section>

</body>
</html>
